name: SonarQube analysis

on:
  push:
    branches: ['main']
  # workflow_dispatch:

permissions:
  pull-requests: read # allows SonarQube to decorate PRs with analysis results

jobs:

  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: run simple hello world
      - run: echo "Hello world"

      - name: echo to file
      - run: echo "Hello world" > test

      - name: print 
      - run: ls -rt .
